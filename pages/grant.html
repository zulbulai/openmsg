<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allow access - OpenMsg</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1d1f; color: #f4f5f7; font: 14px/1.5 Inter, "Segoe UI", Roboto, system-ui, sans-serif; }
    main { width: min(420px, 92vw); padding: 28px; background: #2a2b2e; border: 1px solid #45464b; border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,.5); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-weight: 800; }
    .brand img { width: 30px; height: 30px; border-radius: 8px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 14px; color: #a0a8b4; }
    ul { margin: 0 0 18px; padding: 0; list-style: none; }
    li { padding: 8px 12px; margin-bottom: 6px; background: #333438; border-radius: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
    .row { display: flex; gap: 10px; justify-content: flex-end; }
    button { height: 36px; padding: 0 16px; border: 0; border-radius: 9px; font: 600 13px inherit; cursor: pointer; }
    #allow { background: #ffc72c; color: #1a1400; }
    #cancel { background: #111318; color: #fff; }
    #result { margin-top: 14px; font-weight: 600; }
    .ok { color: #4ade80; } .bad { color: #ff7a74; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="../icons/icon-48.png" alt=""> <span data-brand>OpenMsg</span></div>
    <h1>Allow access to this website?</h1>
    <p><span data-brand>OpenMsg</span> needs your permission to send requests to the address below. This is used for AI replies, webhooks and chatbot API blocks that you set up. Only requests you configure are sent.</p>
    <ul id="origins"></ul>
    <div class="row"><button id="cancel" type="button">Not now</button><button id="allow" type="button">Allow</button></div>
    <div id="result" role="status"></div>
  </main>
  <script src="grant.js"></script>
</body>
</html>
